{% macro render_styles(settings) %}
<style>
	   .print-format {
	       box-sizing: border-box;
	       padding: 0in;
	       max-width: {{convert_uom(number=settings.page.width, to_uom="mm")}} !important;
	       dpi: {{settings.PDFPrintDPI or 96}}mm;
	       page-width: {{convert_uom(number=settings.page.width, to_uom="mm")}};
	       page-height: {{convert_uom(number=settings.page.height, to_uom="mm")}};
	       margin-top:{{convert_uom(number=settings.page.marginTop, to_uom='mm')}};
	       margin-bottom:{{convert_uom(number=settings.page.marginBottom, to_uom='mm')}};
	       margin-left:{{convert_uom(number=settings.page.marginLeft, to_uom='mm')}};
	       margin-right:{{convert_uom(number=settings.page.marginRight, to_uom='mm')}};
	   }
	   @media screen {
	       #__print_designer {
	           position: relative;
	           /* Use CSS custom properties for page dimensions */
	           --page-width: {{convert_uom(number=settings.page.width, to_uom='px')}};
	           --page-height: {{convert_uom(number=settings.page.height, to_uom='px')}};
	           --header-height: {{settings.page.headerHeightWithMargin or settings.page.marginTop}}px;
	           --footer-height: {{settings.page.footerHeightWithMargin or settings.page.marginBottom}}px;
	           width: var(--page-width);
	           height: var(--page-height);
	           margin: 0 auto;
	           overflow: hidden;
	           box-sizing: border-box;
	       }
	       .print-format {
	           margin: auto !important;
	       }
	       /* Header positioning - fixed at top of page */
	       #header-html {
	           position: absolute !important;
	           top: 0 !important;
	           left: 0 !important;
	           width: 100% !important;
	           height: var(--header-height) !important;
	           box-sizing: border-box !important;
	           overflow: hidden !important;
	           z-index: 10;
	       }
	       /* Footer positioning - fixed at bottom of page */
	       #footer-html {
	           position: absolute !important;
	           bottom: 0 !important;
	           left: 0 !important;
	           width: 100% !important;
	           height: var(--footer-height) !important;
	           box-sizing: border-box !important;
	           overflow: hidden !important;
	           z-index: 10;
	       }
	       /* Body content fills remaining space between header and footer */
	       #__print_designer > div:not(#header-html):not(#footer-html) {
	           position: absolute !important;
	           top: var(--header-height) !important;
	           left: 0 !important;
	           width: 100% !important;
	           height: calc(100% - var(--header-height) - var(--footer-height)) !important;
	           overflow: visible !important;
	           box-sizing: border-box !important;
	           z-index: 1;
	       }
	   }
	   /* set margin to 0 for print (Ctrl + p) on client browsers
	   and remove margin container that was added for screen ( viewing )  */
	   @media print {
	      .print-format {
	           margin: 0 !important;
	       }
	       .printview-header-margin {
	           display: none;
	       }

	       /* Fix double footer/header issue by hiding hidden-pdf elements during browser print */
	       .hidden-pdf {
	           display: none !important;
	       }

	       /* Show visible-pdf elements during browser print */
	       .visible-pdf {
	           display: block !important;
	       }

	       /* Add CSS-based page numbering for browser print */
	       @page {
	           margin: 20mm;
	           @top-right {
	               content: counter(page) " / " counter(pages);
	               font-size: 12px;
	               color: #666;
	           }
	       }

	       /* Reset page counter for each document */
	       body {
	           counter-reset: page;
	       }

	       /* Enhanced page break controls */
	       .page-break {
	           page-break-before: always !important;
	           break-before: page !important;
	       }

	       .page-break-after {
	           page-break-after: always !important;
	           break-after: page !important;
	       }

	       .no-page-break {
	           page-break-inside: avoid !important;
	           break-inside: avoid !important;
	       }

	       /* Enhanced table page breaking */
	       table {
	           break-inside: auto !important;
	       }

	       table thead {
	           break-after: avoid !important;
	       }

	       table tbody tr {
	           break-inside: avoid !important;
	       }

	       /* Fix header/footer positioning for browser print */
	       #header-html, #footer-html {
	           position: static !important;
	       }
	   }
	   .print-designer-container {
	       position: absolute;
	   }
	   .table {
	       margin: 0;
	   }
	.print-format p {
	       margin: 0 !important;
	   }
	   tr:first-child th {
	       border-top-style: solid !important;
	   }
	   tr th:first-child {
	       border-left-style: solid !important;
	   }
	   tr th:last-child {
	       border-right-style: solid !important;
	   }
	   tr:last-child td {
	       border-bottom-style: solid !important;
	   }
	   tr td:first-child {
	       border-left-style: solid !important;
	   }
	   tr td:last-child {
	       border-right-style: solid !important;
	   }
	   .flexDynamicText .baseSpanTag {
		 display: block;
	   }
	.flexDynamicText .baseSpanTag .labelSpanTag {
	       display: inline-block;
	       vertical-align: top;
	   }
	.flexDynamicText .baseSpanTag .valueSpanTag {
	       display: inline-block;
	       vertical-align: top;
	   }
	   .flexDirectionColumn .baseSpanTag {
	       display: block;
	   }
	   .flexDirectionColumn .baseSpanTag .labelSpanTag {
	       display: block;
	   }
	   .flexDirectionColumn .baseSpanTag .valueSpanTag {
	       display: block;
	   }
	   /* https://github.com/wkhtmltopdf/wkhtmltopdf/issues/1522 */
	   .relative-row {
	       display: -webkit-box;
	       display: -webkit-flex;
	       display: flex;
	       border-width: 0 !important;
	       flex: auto;
	   }
	   .relative-column {
	       border-width: 0px !important;
	       border-color: transparent !important;
	       flex-direction: column;
	       flex: auto;
	   }
	   * {
	       -webkit-box-sizing: border-box;
	   }
</style>
{% endmacro %}
